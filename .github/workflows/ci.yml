name: CI

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "docker/**"
      - "tests/**"
      - "compose.yaml"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Pi-hole version
        id: version
        run: |
          version="$(awk -F= '/^ARG PIHOLE_VERSION=/{print $2; exit}' docker/Dockerfile)"
          test -n "${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build local smoke image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: pihole-unbound-smoke:${{ steps.version.outputs.version }}

      - name: Smoke test
        run: bash tests/smoke-test.sh pihole-unbound-smoke:${{ steps.version.outputs.version }}
